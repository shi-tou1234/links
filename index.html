<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>电子信息常用网页链接指南</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    /* ==========================================================================
       Aurora Indigo — 编辑杂志风 · 瀑布流
       非对称布局 / 主副卡片层次 / 大留白 / 柔和灵动
    ========================================================================== */
    :root {
      --bg-color: #f4f5fb;
      --text-color: #23263a;
      --text-secondary: #5b6076;
      --link-color: #4f46e5;
      --link-hover: #4338ca;
      --button-hover-color: #eceefb;
      --button-border-color: #e3e5f3;
      --postcard-bg-color: #ffffff;
      --shadow-color: rgba(35, 38, 58, 0.08);
      --selection-color: #dfe3ff;

      /* 柔和多层阴影 */
      --shadow-rest: 0 1px 2px rgba(35, 38, 58, 0.04), 0 10px 30px rgba(35, 38, 58, 0.06);
      --shadow-hover: 0 2px 6px rgba(35, 38, 58, 0.05), 0 24px 56px rgba(79, 70, 229, 0.13);
      --shadow-float: 0 4px 12px rgba(35, 38, 58, 0.08), 0 20px 48px rgba(35, 38, 58, 0.12);
      --accent-glow: rgba(79, 70, 229, 0.13);
      --title-gradient: linear-gradient(120deg, #4f46e5 0%, #8b5cf6 55%, #0ea5e9 100%);

      --radius-card: 20px;
      --radius-featured: 22px;
      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
    }

    [data-theme="dark"] {
      --bg-color: #0e1020;
      --text-color: #e4e6f5;
      --text-secondary: #9a9fc0;
      --link-color: #a5a8ff;
      --link-hover: #c3c6ff;
      --button-hover-color: #1d2038;
      --button-border-color: #2b2f4d;
      --postcard-bg-color: #171a30;
      --shadow-color: rgba(0, 0, 0, 0.4);
      --selection-color: #34376b;

      --shadow-rest: 0 1px 2px rgba(0, 0, 0, 0.28), 0 10px 30px rgba(0, 0, 0, 0.26);
      --shadow-hover: 0 2px 6px rgba(0, 0, 0, 0.30), 0 24px 56px rgba(0, 0, 0, 0.44);
      --shadow-float: 0 4px 12px rgba(0, 0, 0, 0.34), 0 20px 48px rgba(0, 0, 0, 0.38);
      --accent-glow: rgba(165, 168, 255, 0.15);
      --title-gradient: linear-gradient(120deg, #a5a8ff 0%, #c4b5fd 55%, #67e8f9 100%);
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: "Inter", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    ::selection {
      background-color: var(--selection-color);
      color: var(--text-color);
    }

    a { color: var(--link-color); text-decoration: none; }

    button { font-family: inherit; }

    :focus-visible {
      outline: 2px solid var(--link-color);
      outline-offset: 3px;
      border-radius: 8px;
    }

    .sr-only {
      position: absolute;
      width: 1px; height: 1px;
      padding: 0; margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border-width: 0;
    }

    /* ==========================================================================
       页面背景 — 淡雅极光氛围（低饱和，减少视觉疲劳）
    ========================================================================== */
    .page-wrapper {
      position: relative;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background:
        radial-gradient(circle at 12% 8%, rgba(99, 102, 241, 0.07), transparent 34%),
        radial-gradient(circle at 88% 16%, rgba(139, 92, 246, 0.06), transparent 34%),
        radial-gradient(circle at 50% 88%, rgba(14, 165, 233, 0.05), transparent 38%),
        var(--bg-color);
      transition: background 0.3s ease;
    }

    [data-theme="dark"] .page-wrapper {
      background:
        radial-gradient(circle at 12% 8%, rgba(99, 102, 241, 0.14), transparent 36%),
        radial-gradient(circle at 88% 16%, rgba(139, 92, 246, 0.12), transparent 36%),
        radial-gradient(circle at 50% 88%, rgba(56, 189, 248, 0.08), transparent 40%),
        var(--bg-color);
    }

    .page-particles {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    /* ==========================================================================
       顶栏 — 无边框玻璃条
    ========================================================================== */
    .top-bar {
      position: sticky;
      top: 0;
      z-index: 70;
      backdrop-filter: blur(16px) saturate(1.4);
      -webkit-backdrop-filter: blur(16px) saturate(1.4);
      background: color-mix(in srgb, var(--bg-color) 76%, transparent);
      border-bottom: 1px solid color-mix(in srgb, var(--text-color) 6%, transparent);
    }

    .top-bar__inner {
      max-width: 1180px;
      margin: 0 auto;
      padding: 14px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      min-width: 0;
    }

    .brand__logo {
      display: inline-grid;
      width: 36px;
      height: 36px;
      place-items: center;
      border-radius: 12px;
      color: #fff;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.02em;
      background: linear-gradient(135deg, #4f46e5 0%, #8b5cf6 100%);
      box-shadow: 0 4px 14px rgba(79, 70, 229, 0.32), inset 0 1px 0 rgba(255, 255, 255, 0.25);
      flex-shrink: 0;
    }

    .brand__name {
      font-weight: 700;
      font-size: 16px;
      letter-spacing: 0.01em;
      white-space: nowrap;
    }

    .top-bar__tools {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    /* 搜索框：无边框浅底 + 图标 + 清除 */
    .search-box {
      position: relative;
      display: flex;
      align-items: center;
      width: min(100%, 280px);
    }

    .search-box__icon {
      position: absolute;
      left: 14px;
      color: var(--text-secondary);
      pointer-events: none;
      display: inline-flex;
    }

    .search-input {
      width: 100%;
      min-height: 42px;
      border: 1px solid transparent;
      background: color-mix(in srgb, var(--postcard-bg-color) 88%, transparent);
      color: var(--text-color);
      font-family: inherit;
      font-size: 14px;
      border-radius: 999px;
      padding: 9px 40px 9px 40px;
      outline: none;
      box-shadow: var(--shadow-rest);
      transition: border-color 0.2s ease, box-shadow 0.25s ease, background 0.2s ease;
    }

    .search-input::placeholder { color: var(--text-secondary); opacity: 0.75; }

    .search-input:hover {
      background: var(--postcard-bg-color);
      box-shadow: 0 1px 2px rgba(35, 38, 58, 0.05), 0 12px 32px rgba(35, 38, 58, 0.08);
    }

    .search-input:focus {
      background: var(--postcard-bg-color);
      border-color: var(--link-color);
      box-shadow: 0 0 0 4px var(--accent-glow);
    }

    .search-box__clear {
      position: absolute;
      right: 7px;
      display: none;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      border: none;
      border-radius: 999px;
      background: transparent;
      color: var(--text-secondary);
      cursor: pointer;
      transition: color 0.15s ease, background 0.15s ease;
    }

    .search-box__clear:hover { color: var(--text-color); background: var(--button-hover-color); }
    .search-box.has-value .search-box__clear { display: inline-flex; }

    /* 主题切换按钮 */
    .icon-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 42px;
      height: 42px;
      border: 1px solid transparent;
      border-radius: 999px;
      background: color-mix(in srgb, var(--postcard-bg-color) 88%, transparent);
      color: var(--text-color);
      cursor: pointer;
      flex-shrink: 0;
      box-shadow: var(--shadow-rest);
      transition: color 0.2s ease, background 0.2s ease, transform 0.3s var(--ease-out), box-shadow 0.25s ease;
    }

    .icon-button:hover {
      color: var(--link-color);
      background: var(--postcard-bg-color);
      transform: translateY(-2px);
      box-shadow: var(--shadow-hover);
    }

    .icon-button:active { transform: translateY(0) scale(0.92); }

    .icon-button svg { transition: transform 0.6s var(--ease-out); }
    .icon-button:hover svg { transform: rotate(30deg); }

    [data-theme="dark"] .theme-icon-sun { display: none; }
    :not([data-theme="dark"]) .theme-icon-moon { display: none; }

    /* ==========================================================================
       Hero 区 — 大留白编辑风
    ========================================================================== */
    .cover-section {
      position: relative;
      z-index: 10;
      max-width: 880px;
      margin: 0 auto;
      text-align: center;
      padding: 88px 28px 40px;
    }

    .cover-eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 16px;
      border-radius: 999px;
      background: color-mix(in srgb, var(--link-color) 7%, var(--postcard-bg-color));
      color: var(--link-color);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.16em;
      box-shadow: var(--shadow-rest);
    }

    .cover-eyebrow::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 999px;
      background: var(--link-color);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--link-color) 16%, transparent);
    }

    .cover-section h1 {
      margin: 24px 0 0;
      font-size: clamp(32px, 5.4vw, 50px);
      font-weight: 800;
      line-height: 1.22;
      letter-spacing: 0.01em;
      background: var(--title-gradient);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent;
    }

    .cover-subtitle {
      margin: 18px auto 0;
      max-width: 600px;
      font-size: 15.5px;
      line-height: 1.85;
      color: var(--text-secondary);
    }

    .cover-typewriter {
      margin: 18px auto 0;
      min-height: 1.65em;
      font-size: 14px;
      color: var(--text-secondary);
      opacity: 0.85;
    }

    .cover-cursor {
      display: inline-block;
      color: var(--link-color);
      animation: cursorBlink 1s steps(1) infinite;
    }

    @keyframes cursorBlink {
      0%, 48% { opacity: 1; }
      49%, 100% { opacity: 0; }
    }

    .cover-stats {
      display: flex;
      justify-content: center;
      gap: 14px;
      margin-top: 28px;
      flex-wrap: wrap;
    }

    .cover-stat {
      display: inline-flex;
      align-items: baseline;
      gap: 7px;
      padding: 9px 20px;
      border-radius: 999px;
      background: var(--postcard-bg-color);
      box-shadow: var(--shadow-rest);
      font-size: 13px;
      color: var(--text-secondary);
    }

    .cover-stat strong {
      font-size: 18px;
      font-weight: 800;
      color: var(--link-color);
      letter-spacing: 0.01em;
    }

    /* ==========================================================================
       筛选栏 — 无边框柔和 chips
    ========================================================================== */
    .filter-section {
      position: relative;
      margin-bottom: 40px;
    }

    .filter-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: center;
    }

    .filter-chip {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      min-height: 40px;
      border: 1px solid transparent;
      background: var(--postcard-bg-color);
      color: var(--text-secondary);
      font-family: inherit;
      font-size: 13.5px;
      font-weight: 500;
      border-radius: 999px;
      padding: 8px 16px;
      cursor: pointer;
      box-shadow: var(--shadow-rest);
      transition: background 0.25s ease, color 0.25s ease,
                  transform 0.3s var(--ease-out), box-shadow 0.25s ease;
    }

    .filter-chip:hover {
      color: var(--link-color);
      background: color-mix(in srgb, var(--link-color) 7%, var(--postcard-bg-color));
      transform: translateY(-2px);
      box-shadow: var(--shadow-hover);
    }

    .filter-chip:active { transform: translateY(0) scale(0.96); }

    .filter-chip.active {
      background: var(--link-color);
      color: var(--bg-color);
      font-weight: 700;
      box-shadow: 0 6px 18px color-mix(in srgb, var(--link-color) 34%, transparent);
    }

    .filter-chip__count {
      display: inline-grid;
      place-items: center;
      min-width: 20px;
      height: 20px;
      padding: 0 6px;
      border-radius: 999px;
      background: color-mix(in srgb, var(--text-color) 7%, transparent);
      font-size: 11px;
      font-weight: 700;
      line-height: 1;
    }

    .filter-chip.active .filter-chip__count {
      background: color-mix(in srgb, var(--bg-color) 24%, transparent);
      color: var(--bg-color);
    }

    /* ==========================================================================
       瀑布流 — CSS multi-column 非对称布局
    ========================================================================== */
    .masonry {
      columns: auto;
      column-width: 300px;
      column-gap: 28px;
    }

    .masonry > * {
      break-inside: avoid;
      margin-bottom: 28px;
    }

    /* ---------- 普通卡：白底柔和、渐变小图标 ---------- */
    .nav-card {
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 26px 26px 22px;
      border-radius: var(--radius-card);
      overflow: hidden;
      text-decoration: none;
      cursor: pointer;
      background: var(--postcard-bg-color);
      box-shadow: var(--shadow-rest);
      transform: translate3d(0, 0, 0);
      transition: transform 0.5s var(--ease-out),
                  box-shadow 0.5s var(--ease-out),
                  background 0.3s ease,
                  opacity 0.4s ease,
                  filter 0.5s ease;
      will-change: transform;
    }

    .nav-card__head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
    }

    .nav-card__icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 46px;
      height: 46px;
      border-radius: 15px;
      font-size: 15px;
      font-weight: 800;
      color: #fff;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.22);
      box-shadow: 0 6px 16px rgba(35, 38, 58, 0.16), inset 0 1px 0 rgba(255, 255, 255, 0.28);
      transition: transform 0.5s var(--ease-out), box-shadow 0.4s ease;
    }

    .nav-card:hover .nav-card__icon {
      transform: translateY(-2px) scale(1.06) rotate(-3deg);
      box-shadow: 0 10px 22px rgba(35, 38, 58, 0.20), inset 0 1px 0 rgba(255, 255, 255, 0.32);
    }

    .nav-card__arrow {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 30px;
      height: 30px;
      border-radius: 999px;
      color: var(--link-color);
      background: color-mix(in srgb, var(--link-color) 8%, transparent);
      opacity: 0;
      transform: translateX(-8px) scale(0.85);
      transition: opacity 0.3s ease, transform 0.45s var(--ease-out);
      flex-shrink: 0;
    }

    .nav-card:hover .nav-card__arrow {
      opacity: 1;
      transform: translateX(0) scale(1);
    }

    .nav-card__name {
      font-size: 16.5px;
      font-weight: 700;
      line-height: 1.4;
      color: var(--text-color);
      letter-spacing: 0.01em;
      transition: color 0.25s ease;
    }

    .nav-card:hover .nav-card__name { color: var(--link-color); }

    .nav-card__desc {
      margin: 0;
      font-size: 13.5px;
      line-height: 1.75;
      color: var(--text-secondary);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .nav-card__tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 2px;
    }

    .nav-card__tag {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      padding: 3px 11px;
      font-size: 11px;
      font-weight: 500;
      color: var(--text-secondary);
      background: color-mix(in srgb, var(--text-color) 5%, transparent);
      transition: color 0.25s ease, background 0.25s ease;
    }

    .nav-card:hover .nav-card__tag {
      color: var(--link-color);
      background: color-mix(in srgb, var(--link-color) 8%, transparent);
    }

    /* Hover：柔和上浮 + 阴影舒展 */
    .nav-card:hover {
      transform: translate3d(0, -6px, 0);
      box-shadow: var(--shadow-hover);
    }

    .nav-card:active {
      transform: translate3d(0, -2px, 0) scale(0.99);
      transition-duration: 0.1s;
    }

    /* ---------- 主卡（featured）：整卡渐变、白字、更大体量 ---------- */
    .nav-card--featured {
      padding: 30px 28px 26px;
      border-radius: var(--radius-featured);
      color: #fff;
      gap: 14px;
      box-shadow: 0 2px 6px rgba(35, 38, 58, 0.10), 0 20px 48px rgba(35, 38, 58, 0.18);
    }

    .nav-card--featured::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(165deg, rgba(255, 255, 255, 0.14), transparent 45%);
      pointer-events: none;
    }

    .nav-card--featured .nav-card__icon {
      width: 62px;
      height: 62px;
      border-radius: 18px;
      font-size: 20px;
      background: rgba(255, 255, 255, 0.18);
      border: 1px solid rgba(255, 255, 255, 0.40);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      box-shadow: 0 10px 24px rgba(15, 16, 32, 0.22), inset 0 1px 0 rgba(255, 255, 255, 0.30);
    }

    .nav-card--featured .nav-card__name {
      font-size: 21px;
      font-weight: 800;
      color: #fff;
      text-shadow: 0 1px 4px rgba(15, 16, 32, 0.25);
    }

    .nav-card--featured .nav-card__desc {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.88);
      -webkit-line-clamp: 4;
      text-shadow: 0 1px 2px rgba(15, 16, 32, 0.12);
    }

    .nav-card--featured .nav-card__tag {
      color: rgba(255, 255, 255, 0.95);
      background: rgba(255, 255, 255, 0.16);
      border: 1px solid rgba(255, 255, 255, 0.22);
    }

    .nav-card--featured .nav-card__arrow {
      color: #fff;
      background: rgba(255, 255, 255, 0.20);
    }

    .nav-card--featured:hover {
      box-shadow: 0 6px 16px rgba(35, 38, 58, 0.14), 0 32px 72px rgba(35, 38, 58, 0.26);
    }

    /* 主卡光泽扫过 */
    .nav-card__sheen {
      position: absolute;
      inset: 0;
      background: linear-gradient(115deg, transparent 32%, rgba(255, 255, 255, 0.26) 50%, transparent 68%);
      transform: translateX(-110%);
      transition: transform 1s var(--ease-out);
      pointer-events: none;
      z-index: 1;
    }

    .nav-card--featured:hover .nav-card__sheen { transform: translateX(110%); }

    .nav-card--featured > * { position: relative; z-index: 2; }
    .nav-card--featured > .nav-card__sheen { z-index: 1; }

    /* Scroll-reveal */
    .nav-card.post-card-reveal {
      opacity: 0;
      transform: translate3d(0, 26px, 0) scale(0.98);
      filter: blur(5px) saturate(0.94);
    }

    .nav-card.post-card-reveal.is-visible {
      opacity: 1;
      transform: translateY(0) scale(1);
      filter: blur(0) saturate(1);
      transition-delay: var(--card-reveal-delay, 0ms);
    }

    /* 骨架屏 — 高低错落 */
    .skeleton-card {
      border-radius: var(--radius-card);
      background: var(--postcard-bg-color);
      box-shadow: var(--shadow-rest);
      padding: 26px 26px 22px;
      display: grid;
      gap: 12px;
    }

    .skeleton-card__dot,
    .skeleton-card__line {
      background: linear-gradient(90deg,
        color-mix(in srgb, var(--text-color) 5%, transparent) 25%,
        color-mix(in srgb, var(--text-color) 10%, transparent) 50%,
        color-mix(in srgb, var(--text-color) 5%, transparent) 75%);
      background-size: 200% 100%;
      animation: skeletonShimmer 1.4s ease-in-out infinite;
    }

    .skeleton-card__dot { width: 46px; height: 46px; border-radius: 15px; }
    .skeleton-card__line { height: 13px; border-radius: 7px; }
    .skeleton-card__line--title { width: 52%; height: 17px; }
    .skeleton-card__line--short { width: 68%; }

    @keyframes skeletonShimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* ==========================================================================
       空状态 / 回到顶部 / 页脚
    ========================================================================== */
    .empty-hint {
      display: none;
      text-align: center;
      padding: 72px 24px;
    }

    .empty-hint__icon {
      display: inline-grid;
      place-items: center;
      width: 60px;
      height: 60px;
      margin-bottom: 18px;
      border-radius: 20px;
      border: 1px dashed color-mix(in srgb, var(--link-color) 38%, transparent);
      color: var(--link-color);
      background: color-mix(in srgb, var(--link-color) 6%, var(--postcard-bg-color));
    }

    .empty-hint__title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .empty-hint__desc {
      font-size: 13.5px;
      color: var(--text-secondary);
      margin-bottom: 22px;
    }

    .empty-hint__reset {
      display: inline-flex;

      cardGrid.innerHTML = heights.map(lines => `
        <div class="skeleton-card" aria-hidden="true">
          <div class="skeleton-card__dot"></div>
          <div class="skeleton-card__line skeleton-card__line--title" style="width:${lines[0]};"></div>
          ${lines.slice(1).map(w => `<div class="skeleton-card__line" style="width:${w};"></div>`).join("")}
        </div>
      `).join("");
    }

    function buildCard(item, index) {
      const featured = isFeatured(index);
      const gradient = item.color || hashColor(item.url);

      const card = document.createElement("a");
      card.href = item.url;
      card.target = "_blank";
      card.rel = "noopener noreferrer";
      card.className = featured ? "nav-card nav-card--featured post-card-reveal" : "nav-card post-card-reveal";
      card.setAttribute("data-card-reveal", "");
      card.style.setProperty("--card-reveal-delay", `${Math.min(index, 12) * 50}ms`);
      if (featured) card.style.background = gradient;

      // 光泽扫过（仅主卡）
      if (featured) {
        const sheen = document.createElement("span");
        sheen.className = "nav-card__sheen";
        card.appendChild(sheen);
      }

      // 头部：图标 + 箭头
      const head = document.createElement("div");
      head.className = "nav-card__head";

      const icon = document.createElement("span");
      icon.className = "nav-card__icon";
      icon.textContent = item.icon || item.name.slice(0, 2);
      if (!featured) icon.style.background = gradient;
      head.appendChild(icon);

      const arrow = document.createElement("span");
      arrow.className = "nav-card__arrow";
      arrow.setAttribute("aria-hidden", "true");
      arrow.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="7" y1="17" x2="17" y2="7"/><polyline points="7 7 17 7 17 17"/></svg>';
      head.appendChild(arrow);
      card.appendChild(head);

      // 名称
      const name = document.createElement("div");
      name.className = "nav-card__name";
      name.textContent = item.name;
      card.appendChild(name);

      // 描述
      const desc = document.createElement("p");
      desc.className = "nav-card__desc";
      desc.textContent = item.description;
      card.appendChild(desc);

      // 标签
      const tagRow = document.createElement("div");
      tagRow.className = "nav-card__tags";
      item.tags.forEach(tag => {
        const span = document.createElement("span");
        span.className = "nav-card__tag";
        span.textContent = TAG_LABELS[tag] || tag;
        tagRow.appendChild(span);
      });
      card.appendChild(tagRow);

      return card;
    }

    function renderCards(items) {
      cardGrid.innerHTML = "";
      items.forEach((item, index) => cardGrid.appendChild(buildCard(item, index)));
      emptyHint.style.display = items.length ? "none" : "block";
    }

    /* ===== 筛选 + 搜索 ===== */
    function applyFilter(filter, keyword = "") {
      const kw = keyword.trim().toLowerCase();
      const filtered = uniqueLinks.filter(item => {
        const matchesFilter = filter === "all" || item.tags.includes(filter);
        const matchesKeyword = !kw || item.name.toLowerCase().includes(kw) || item.description.toLowerCase().includes(kw) || item.tags.some(tag => tag.includes(kw));
        return matchesFilter && matchesKeyword;
      });
      renderCards(filtered);
      initPostCardReveal();
    }

    let currentFilter = "all";
    const filterButtons = Array.from(document.querySelectorAll("[data-filter]"));

    /* 每个分类的站点计数徽章 */
    function initFilterCounts() {
      filterButtons.forEach(button => {
        const key = button.dataset.filter;
        const count = key === "all" ? uniqueLinks.length : uniqueLinks.filter(item => item.tags.includes(key)).length;
        const badge = document.createElement("span");
        badge.className = "filter-chip__count";
        badge.textContent = count;
        button.appendChild(badge);
      });
    }

    function setActiveFilter(key) {
      filterButtons.forEach(b => b.classList.toggle("active", b.dataset.filter === key));
      currentFilter = key;
      applyFilter(currentFilter, siteSearch.value);
    }

    filterButtons.forEach(button => {
      button.addEventListener("click", () => setActiveFilter(button.dataset.filter));
    });

    siteSearch.addEventListener("input", () => {
      searchBox.classList.toggle("has-value", siteSearch.value.length > 0);
      applyFilter(currentFilter, siteSearch.value);
    });

    searchClear.addEventListener("click", () => {
      siteSearch.value = "";
      searchBox.classList.remove("has-value");
      applyFilter(currentFilter, "");
      siteSearch.focus();
    });

    resetFilter.addEventListener("click", () => {
      siteSearch.value = "";
      searchBox.classList.remove("has-value");
      setActiveFilter("all");
    });

    /* ===== Hero 统计 ===== */
    function renderStats() {
      const categoryCount = filterButtons.length - 1;
      coverStats.innerHTML = `
        <span class="cover-stat"><strong>${uniqueLinks.length}</strong> 个精选站点</span>
        <span class="cover-stat"><strong>${categoryCount}</strong> 个分类</span>
      `;
    }

    /* ===== Scroll-triggered card reveal ===== */
    function initPostCardReveal() {
      const cards = Array.from(document.querySelectorAll("[data-card-reveal]"));
      if (cards.length === 0) return;

      const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      if (reduceMotion) {
        cards.forEach(card => {
          card.classList.remove("post-card-reveal");
          card.classList.add("is-visible");
        });
        return;
      }

      const observer = new IntersectionObserver(
        (entries, currentObserver) => {
          entries.forEach(entry => {
            if (!entry.isIntersecting) return;
            entry.target.classList.add("is-visible");
            currentObserver.unobserve(entry.target);
          });
        },
        { root: null, rootMargin: "0px 0px -4% 0px", threshold: 0.01 },
      );

      cards.forEach(card => observer.observe(card));
    }

    /* ===== 打字机 ===== */
    const typewriterTexts = [
      "当前共整理多个常用站点，按分类整理，可直接跳转使用",
      "适合查芯片、EDA、课程、竞赛、求职和日常学习资料",
      "建议配合课设、实验、竞赛和求职阶段分批收藏",
    ];
    const typewriterTarget = document.getElementById("typewriterTarget");
    let phraseIndex = 0;
    let charIndex = 0;
    let isDeleting = false;

    function typeWriter() {
      const current = typewriterTexts[phraseIndex % typewriterTexts.length];
      if (!isDeleting) {
        typewriterTarget.textContent = current.slice(0, charIndex + 1);
        charIndex += 1;
        if (charIndex === current.length) {
          setTimeout(() => { isDeleting = true; typeWriter(); }, 1400);
          return;
        }
      } else {
        typewriterTarget.textContent = current.slice(0, charIndex - 1);
        charIndex -= 1;
        if (charIndex === 0) {
          isDeleting = false;
          phraseIndex += 1;
        }
      }
      setTimeout(typeWriter, isDeleting ? 30 : 65);
    }

    /* ===== 粒子背景（稀疏淡雅） ===== */
    function initParticles() {
      const canvas = document.getElementById("pageParticles");
      if (!canvas || window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
        return;
      }
      const ctx = canvas.getContext("2d");
      const resize = () => {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      };
      resize();
      window.addEventListener("resize", resize);
      const particles = Array.from({ length: 26 }).map(() => ({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        radius: Math.random() * 1.2 + 0.5,
        speedX: (Math.random() - 0.5) * 0.22,
        speedY: (Math.random() - 0.5) * 0.22,
        opacity: Math.random() * 0.16 + 0.06,
      }));
      const draw = () => {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const color = document.documentElement.getAttribute("data-theme") === "dark" ? "196, 199, 255" : "99, 102, 241";
        particles.forEach(p => {
          p.x += p.speedX;
          p.y += p.speedY;
          if (p.x < -20) p.x = canvas.width + 20;
          if (p.x > canvas.width + 20) p.x = -20;
          if (p.y < -20) p.y = canvas.height + 20;
          if (p.y > canvas.height + 20) p.y = -20;
          ctx.beginPath();
          ctx.fillStyle = `rgba(${color}, ${p.opacity})`;
          ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
          ctx.fill();
        });
        requestAnimationFrame(draw);
      };
      draw();
    }

    /* ===== 主题 ===== */
    function applyTheme() {
      const saved = localStorage.getItem("ee-guide-theme");
      const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
      const theme = saved ? saved : prefersDark ? "dark" : "light";
      document.documentElement.setAttribute("data-theme", theme);
    }

    themeToggle.addEventListener("click", () => {
      const current = document.documentElement.getAttribute("data-theme");
      const next = current === "dark" ? "light" : "dark";
      localStorage.setItem("ee-guide-theme", next);
      applyTheme();
    });

    /* ===== 回到顶部 ===== */
    window.addEventListener("scroll", () => {
      backToTop.classList.toggle("is-visible", window.scrollY > 380);
    }, { passive: true });

    backToTop.addEventListener("click", () => {
      window.scrollTo({ top: 0, behavior: "smooth" });
    });

    /* ===== Init ===== */
    applyTheme();
    initParticles();
    renderStats();
    initFilterCounts();
    renderSkeletons();
    // 骨架短暂展示后替换为真实卡片，营造加载节奏
    setTimeout(() => {
      renderCards(uniqueLinks);
      initPostCardReveal();
    }, 220);
    setTimeout(typeWriter, 400);
  </script>
</body>
</html>
