<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>电子信息常用网页链接指南</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/main.css?v=4" />
</head>
<body>
  <div class="page-wrapper">
    <canvas id="pageParticles" class="page-particles" aria-hidden="true"></canvas>

    <header class="top-bar">
      <div class="top-bar__inner">
        <div class="brand">
          <span class="brand__logo" aria-hidden="true">EE</span>
          <span class="brand__name">电子信息常用资源</span>
        </div>
        <div class="top-bar__tools">
          <div class="search-box" id="searchBox">
            <span class="search-box__icon" aria-hidden="true">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8" /><line x1="21" y1="21" x2="16.65" y2="16.65" />
              </svg>
            </span>
            <label class="sr-only" for="siteSearch">搜索资源</label>
            <input id="siteSearch" class="search-input" placeholder="搜索站点、描述或分类..." autocomplete="off" />
            <button type="button" class="search-box__clear" id="searchClear" aria-label="清空搜索">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M18 6 6 18" /><path d="m6 6 12 12" />
              </svg>
            </button>
          </div>
          <button id="themeToggle" class="icon-button" title="切换深色/浅色主题" aria-label="切换深色/浅色主题">
            <svg class="theme-icon-sun" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="5" /><path d="M12 1v2m0 18v2M4.22 4.22l1.42 1.42m12.72 12.72 1.42 1.42M1 12h2m18 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" />
            </svg>
            <svg class="theme-icon-moon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
            </svg>
          </button>
        </div>
      </div>
    </header>

    <section class="cover-section">
      <span class="cover-eyebrow">EE LINKS · 站点导航</span>
      <h1>电子信息常用网页链接指南</h1>
      <p class="cover-subtitle">
        一份面向电子信息学生的常用站点索引，覆盖芯片选型、EDA 工具、竞赛资源和求职准备。
      </p>
      <p class="cover-typewriter">
        <span id="typewriterTarget">当前共整理多个常用站点，按分类整理，可直接跳转使用</span><span class="cover-cursor" aria-hidden="true">|</span>
      </p>
      <div class="cover-stats" id="coverStats" aria-hidden="true"></div>
    </section>

    <main>
      <section class="filter-section" aria-label="按分类筛选">
        <div class="filter-row" id="filterRow">
          <button class="filter-chip active" data-filter="all">全部</button>
          <button class="filter-chip" data-filter="components">买件/常用商城</button>
          <button class="filter-chip" data-filter="datasheet">Datasheet/型号</button>
          <button class="filter-chip" data-filter="pcb">原理图/PCB/开源硬件</button>
          <button class="filter-chip" data-filter="learn">学习/课程/视频</button>
          <button class="filter-chip" data-filter="tools">EDA/仿真/软件工具</button>
          <button class="filter-chip" data-filter="community">社区/博客/资讯</button>
          <button class="filter-chip" data-filter="competition">竞赛/实验室/作品</button>
          <button class="filter-chip" data-filter="job">考研/求职/技能</button>
          <button class="filter-chip" data-filter="favorites">★ 收藏</button>
        </div>
      </section>

      <div id="emptyHint" class="empty-hint">
        <div class="empty-hint__icon" aria-hidden="true">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8" /><line x1="21" y1="21" x2="16.65" y2="16.65" /><line x1="8" y1="11" x2="14" y2="11" />
          </svg>
        </div>
        <div class="empty-hint__title">没有匹配的站点</div>
        <div class="empty-hint__desc">试试更短的关键词，或切换到其他分类。</div>
        <button type="button" class="empty-hint__reset" id="resetFilter">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" /><path d="M3 3v5h5" />
          </svg>
          重置筛选
        </button>
      </div>

      <div id="cardGrid" class="masonry"></div>
    </main>

    <footer class="site-footer">
      建议收藏常用站点，按自己当前课设、实验、竞赛和求职阶段分批整理。
    </footer>

    <button id="backToTop" class="back-top" aria-label="回到顶部" title="回到顶部">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="18 15 12 9 6 15"></polyline>
      </svg>
    </button>
  </div>

  <script defer src="js/data.js?v=4"></script>
  <script defer src="js/render.js?v=4"></script>
  <script defer src="js/filter.js?v=4"></script>
  <script defer src="js/theme.js?v=4"></script>
  <script defer src="js/effects.js?v=4"></script>
  <script defer src="js/main.js?v=4"></script>
</body>
</html>
