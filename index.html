<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' file:; style-src 'self' file: 'unsafe-inline'; img-src 'self' file: data:; font-src 'self' file:; object-src 'none'; base-uri 'none'; form-action 'none'" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <meta name="description" content="面向电子信息学生的常用站点索引：芯片选型、Datasheet、EDA 工具、PCB 打样、课程学习、竞赛与求职资源导航。" />
  <meta name="theme-color" content="#080414" />
  <meta name="color-scheme" content="dark" />
  <title>电子信息常用网页链接指南</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <!-- 字体已自托管（拉丁子集），中文走系统字体栈，无第三方请求 -->
  <link rel="stylesheet" href="css/fonts.css?v=9" />
  <link rel="stylesheet" href="css/base.css?v=9" />
  <link rel="stylesheet" href="css/layout.css?v=9" />
  <link rel="stylesheet" href="css/components.css?v=9" />
  <link rel="stylesheet" href="css/cards.css?v=9" />
  <link rel="stylesheet" href="css/masonry.css?v=9" />
</head>
<body>

  <!-- 背景层 -->
  <div class="mesh-bg"></div>
  <div class="grain"></div>
  <div class="cursor-glow" id="cursorGlow"></div>
  <div class="scroll-progress" id="scrollProgress"></div>
  <canvas id="pageParticles" class="page-particles" aria-hidden="true"></canvas>

  <!-- 顶栏 -->
  <header class="top-bar" id="topBar">
    <div class="brand">
      <span class="brand__logo" aria-hidden="true">
        <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="6" y="6" width="20" height="20" rx="4" stroke="white" stroke-width="1.8" fill="none"/>
          <rect x="12" y="12" width="8" height="8" rx="1.5" fill="white" opacity="0.9"/>
          <line x1="10" y1="3" x2="10" y2="6" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
          <line x1="16" y1="3" x2="16" y2="6" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
          <line x1="22" y1="3" x2="22" y2="6" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
          <line x1="10" y1="26" x2="10" y2="29" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
          <line x1="16" y1="26" x2="16" y2="29" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
          <line x1="22" y1="26" x2="22" y2="29" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
          <line x1="3" y1="10" x2="6" y2="10" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
          <line x1="3" y1="16" x2="6" y2="16" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
          <line x1="3" y1="22" x2="6" y2="22" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
          <line x1="26" y1="10" x2="29" y2="10" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
          <line x1="26" y1="16" x2="29" y2="16" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
          <line x1="26" y1="22" x2="29" y2="22" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </span>
      <span class="brand__name">电子信息常用资源</span>
    </div>
    <div class="top-bar__tools">
      <div class="search-box" id="searchBox">
        <span class="search-box__icon" aria-hidden="true">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8" /><line x1="21" y1="21" x2="16.65" y2="16.65" />
          </svg>
        </span>
        <label class="sr-only" for="siteSearch">搜索资源</label>
        <input id="siteSearch" class="search-input" type="search" placeholder="搜索站点..." autocomplete="off" />
        <button type="button" class="search-box__clear" id="searchClear" aria-label="清空搜索">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 6 6 18" /><path d="m6 6 12 12" />
          </svg>
        </button>
      </div>
    </div>
  </header>

  <div class="page-wrapper">

    <!-- Hero -->
    <section class="hero">
      <div class="hero-card reveal">
        <div class="hero-badge">
          <span class="live-dot"></span>
          EE LINKS · 站点导航
        </div>
        <h1 class="hero-title">
          电子信息常用网页<br><em>链接指南</em>
        </h1>
        <p class="hero-subtitle">
          一份面向电子信息学生的常用站点索引，覆盖芯片选型、EDA 工具、竞赛资源和求职准备。
        </p>
        <p class="hero-typewriter">
          <span id="typewriterTarget"></span><span class="hero-cursor" aria-hidden="true">|</span>
        </p>
        <div class="cover-stats" id="coverStats" aria-hidden="true"></div>
      </div>
    </section>

    <main>
      <!-- 筛选栏 -->
      <section class="filter-section" aria-label="按分类筛选">
        <div class="filter-row" id="filterRow">
          <button class="filter-chip active" data-filter="all" aria-pressed="true">全部</button>
          <button class="filter-chip" data-filter="components" aria-pressed="false">买件/常用商城</button>
          <button class="filter-chip" data-filter="datasheet" aria-pressed="false">Datasheet/型号</button>
          <button class="filter-chip" data-filter="pcb" aria-pressed="false">原理图/PCB/开源硬件</button>
          <button class="filter-chip" data-filter="learn" aria-pressed="false">学习/课程/视频</button>
          <button class="filter-chip" data-filter="tools" aria-pressed="false">EDA/仿真/软件工具</button>
          <button class="filter-chip" data-filter="community" aria-pressed="false">社区/博客/资讯</button>
          <button class="filter-chip" data-filter="competition" aria-pressed="false">竞赛/实验室/作品</button>
          <button class="filter-chip" data-filter="job" aria-pressed="false">考研/求职/技能</button>
          <button class="filter-chip" data-filter="favorites" aria-pressed="false">★ 收藏</button>
        </div>
      </section>

      <div id="emptyHint" class="empty-hint">
        <div class="empty-hint__icon" aria-hidden="true">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8" /><line x1="21" y1="21" x2="16.65" y2="16.65" /><line x1="8" y1="11" x2="14" y2="11" />
          </svg>
        </div>
        <div class="empty-hint__title">没有匹配的站点</div>
        <div class="empty-hint__desc">试试更短的关键词，或切换到其他分类。</div>
        <button type="button" class="empty-hint__reset" id="resetFilter">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" /><path d="M3 3v5h5" />
          </svg>
          重置筛选
        </button>
      </div>

      <div id="cardGrid" class="masonry"></div>
    </main>

    <footer class="site-footer">
      建议收藏常用站点，按自己当前课设、实验、竞赛和求职阶段分批整理。 <span class="heart">♡</span>
    </footer>

    <button id="backToTop" class="back-top" aria-label="回到顶部" title="回到顶部">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="18 15 12 9 6 15"></polyline>
      </svg>
    </button>
  </div>

  <script defer src="js/data.js?v=9"></script>
  <script defer src="js/render.js?v=9"></script>
  <script defer src="js/filter.js?v=9"></script>
  <script defer src="js/effects.js?v=9"></script>
  <script defer src="js/main.js?v=9"></script>
</body>
</html>
