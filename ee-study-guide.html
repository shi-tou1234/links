      { name: "璧涙蔼", url: "https://www.saikr.com/", tags: ["competition"], icon: "璧?, description: "閫傚悎鎵惧ぇ瀛︾敓绔炶禌銆佺鍒涙瘮璧涘拰椤圭洰瀹炶返鏈轰細銆? },
      { name: "鐭ョ綉", url: "https://www.cnki.net/", tags: ["learn", "job"], icon: "鐭?, description: "閫傚悎鏌ヨ鏂囥€佸啓姣曡鍜屾暣鐞嗘枃鐚患杩般€? },
      { name: "LeetCode", url: "https://leetcode.cn/", tags: ["learn", "job"], icon: "L", description: "閫傚悎鎵撳熀纭€銆佽ˉ绠楁硶鍜屽噯澶囩瑪璇曢潰璇曘€? },
      { name: "鐗涘缃?, url: "https://www.nowcoder.com/", tags: ["learn", "job"], icon: "鐗?, description: "閫傚悎鐪嬫牎鎷涖€佺瑪璇曘€侀潰璇曞拰姹傝亴缁忛獙銆? },
      { name: "鏋佸鏃堕棿", url: "https://time.geekbang.org/", tags: ["learn", "job"], icon: "鏋?, description: "閫傚悎鐪嬬郴缁熷寲涓撴爮鍜屽伐绋嬭繘闃惰绋嬨€? },
      { name: "鑿滈笩鏁欑▼", url: "https://www.runoob.com/", tags: ["learn", "tools"], icon: "鑿?, description: "閫傚悎蹇€熷叆闂ㄨ瑷€銆佸伐鍏峰拰鍩虹姒傚康銆? },
      { name: "MDN Web Docs", url: "https://developer.mozilla.org/", tags: ["learn", "tools"], icon: "M", description: "閫傚悎鏌ュ墠绔€佺綉缁滃拰 Web 寮€鍙戞潈濞佽祫鏂欍€? },
      { name: "Stack Overflow", url: "https://stackoverflow.com/", tags: ["community", "learn"], icon: "S", description: "閫傚悎鏌ョ紪绋嬮棶棰樸€佹姤閿欏拰宸ョ▼瀹炵幇缁嗚妭銆? }
    ];
    const uniqueLinks = [];
    const seen = new Set();
    for (const item of links) {
      if (!seen.has(item.url)) {
        seen.add(item.url);
        uniqueLinks.push(item);
      }
    }

    const cardGrid = document.getElementById("cardGrid");
    const siteSearch = document.getElementById("siteSearch");
    const emptyHint = document.getElementById("emptyHint");
    const themeToggle = document.getElementById("themeToggle");
    const backToTop = document.getElementById("backToTop");

    const gradients = [
      "linear-gradient(-45deg, hsl(235, 25%, 58%) 0%, hsl(275, 22%, 52%) 100%)",
      "linear-gradient(-45deg, hsl(165, 25%, 55%) 0%, hsl(195, 22%, 55%) 100%)",
      "linear-gradient(-45deg, hsl(25, 55%, 52%) 0%, hsl(45, 50%, 50%) 100%)",
      "linear-gradient(-45deg, hsl(141, 45%, 46%) 0%, hsl(181, 42%, 42%) 100%)",
      "linear-gradient(-45deg, hsl(210, 40%, 52%) 0%, hsl(240, 30%, 50%) 100%)",
      "linear-gradient(-45deg, hsl(340, 35%, 54%) 0%, hsl(20, 40%, 52%) 100%)"
    ];

    function hashColor(str) {
      let h = 0;
      for (let i = 0; i < str.length; i++) {
        h = (h * 31 + str.charCodeAt(i)) | 0;
      }
      return gradients[(Math.abs(h) + 7) % gradients.length];
    }

    function renderCards(items) {
      cardGrid.innerHTML = "";
      items.forEach((item, index) => {
        const card = document.createElement("a");
        card.href = item.url;
        card.target = "_blank";
        card.rel = "noopener noreferrer";
        card.className = "nav-card";
        card.setAttribute("data-tags", item.tags.join(" "));
        card.setAttribute("data-keywords", `${item.name} ${item.description} ${item.tags.join(" ")}`.toLowerCase());

        const bg = document.createElement("span");
        bg.className = "nav-card-bg";
        bg.style.background = item.color || hashColor(item.url);

        const icon = document.createElement("span");
        icon.className = "nav-card-icon";
        icon.textContent = item.icon || item.name.slice(0, 2);

        const label = document.createElement("span");
        label.className = "nav-card-label";
        label.textContent = item.name;

        const content = document.createElement("div");
        content.className = "nav-card__content";

        const title = document.createElement("div");
        title.className = "nav-card__title";
        title.textContent = item.name;

        const desc = document.createElement("p");
        desc.className = "nav-card__description";
        desc.textContent = item.description;

        const tagRow = document.createElement("div");
        tagRow.style.display = "flex";
        tagRow.style.flexWrap = "wrap";
        tagRow.style.gap = "8px";
        item.tags.forEach(tag => {
          const span = document.createElement("span");
          span.className = "pill";
          span.textContent = tag;
          tagRow.appendChild(span);
        });

        content.appendChild(title);
        content.appendChild(desc);
        content.appendChild(tagRow);

        card.appendChild(bg);
        card.appendChild(icon);
        card.appendChild(label);
        card.appendChild(content);
        cardGrid.appendChild(card);
      });

      emptyHint.style.display = items.length ? "none" : "block";

      requestAnimationFrame(() => {
        document.querySelectorAll(".nav-card").forEach((node, idx) => {
          node.style.transitionDelay = `${(idx % 12) * 35}ms`;
        });
      });
    }
    function applyFilter(filter, keyword = "") {
      const kw = keyword.trim().toLowerCase();
      const filtered = uniqueLinks.filter(item => {
        const matchesFilter = filter === "all" || item.tags.includes(filter);
        const matchesKeyword = !kw || item.name.toLowerCase().includes(kw) || item.description.toLowerCase().includes(kw) || item.tags.some(tag => tag.includes(kw));
        return matchesFilter && matchesKeyword;
      });
      renderCards(filtered);
    }

    let currentFilter = "all";
    document.querySelectorAll("[data-filter]").forEach(button => {
      button.addEventListener("click", () => {
        document.querySelectorAll("[data-filter]").forEach(b => b.classList.remove("active"));
        button.classList.add("active");
        currentFilter = button.dataset.filter;
        applyFilter(currentFilter, siteSearch.value);
      });
    });

    siteSearch.addEventListener("input", () => applyFilter(currentFilter, siteSearch.value));

    const typewriterTexts = [
      "褰撳墠宸叉暣鐞嗘牳蹇冨父鐢ㄧ珯鐐癸紝鍙寜鍒嗙被绛涢€夊拰鎼滅储",
      "閲嶇偣瑕嗙洊鑺墖璧勬枡銆丒DA 宸ュ叿銆佽绋嬨€佺珵璧涖€佹眰鑱屽拰绀惧尯",
      "寤鸿鎸夎璁俱€佸疄楠屻€佺珵璧涘拰姹傝亴闃舵鍒嗘壒鏀惰棌"
    ];
    const typewriterTarget = document.getElementById("typewriterTarget");
    let phraseIndex = 0;
    let charIndex = 0;
    let isDeleting = false;

    function typeWriter() {
      const current = typewriterTexts[phraseIndex % typewriterTexts.length];
      if (!isDeleting) {
        typewriterTarget.textContent = current.slice(0, charIndex + 1);
        charIndex += 1;
        if (charIndex === current.length) {
          setTimeout(() => { isDeleting = true; typeWriter(); }, 1400);
          return;
        }
      } else {
        typewriterTarget.textContent = current.slice(0, charIndex - 1);
        charIndex -= 1;
        if (charIndex === 0) {
          isDeleting = false;
          phraseIndex += 1;
        }
      }
      setTimeout(typeWriter, isDeleting ? 28 : 62);
    }

    function initParticles() {
      const canvas = document.getElementById("pageParticles");
      if (!canvas || prefersReducedMotion) {
        return;
      }
      const ctx = canvas.getContext("2d");
      const resize = () => {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      };
      resize();
      window.addEventListener("resize", resize);
      const particles = Array.from({ length: 36 }).map(() => ({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        radius: Math.random() * 1.3 + 0.6,
        speedX: (Math.random() - 0.5) * 0.24,
        speedY: (Math.random() - 0.5) * 0.24,
        opacity: Math.random() * 0.22 + 0.08,
      }));
      const draw = () => {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const color = document.documentElement.getAttribute("data-theme") === "dark" ? "234, 221, 208" : "120, 95, 65";
        particles.forEach(p => {
          p.x += p.speedX;
          p.y += p.speedY;
          if (p.x < -20) p.x = canvas.width + 20;
          if (p.x > canvas.width + 20) p.x = -20;
          if (p.y < -20) p.y = canvas.height + 20;
          if (p.y > canvas.height + 20) p.y = -20;
          ctx.beginPath();
          ctx.fillStyle = `rgba(${color}, ${p.opacity})`;
          ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
          ctx.fill();
        });
        requestAnimationFrame(draw);
      };
      draw();
    }
    function applyTheme() {
      const saved = localStorage.getItem("ee-guide-theme");
      const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
      const theme = saved ? saved : prefersDark ? "dark" : "light";
      document.documentElement.setAttribute("data-theme", theme);
      themeToggle.textContent = theme === "dark" ? "馃寳 涓婚" : "馃寳 涓婚";
    }

    themeToggle.addEventListener("click", () => {
      const current = document.documentElement.getAttribute("data-theme");
      const next = current === "dark" ? "light" : "dark";
      localStorage.setItem("ee-guide-theme", next);
      applyTheme();
    });

    window.addEventListener("scroll", () => {
      backToTop.style.display = window.scrollY > 420 ? "flex" : "none";
    });

    backToTop.addEventListener("click", () => {
      window.scrollTo({ top: 0, behavior: "smooth" });
    });

    function revealOnScroll() {
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            entry.target.classList.add("is-visible");
            observer.unobserve(entry.target);
          }
        });
      }, { threshold: 0.12, rootMargin: "0px 0px -28px 0px" });

      document.querySelectorAll("[data-reveal], .nav-card").forEach(el => observer.observe(el));
    }

    applyTheme();
    initParticles();
    renderCards(uniqueLinks);
    revealOnScroll();
    setTimeout(typeWriter, prefersReducedMotion ? 0 : 420);
  </script>
